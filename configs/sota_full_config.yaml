pipeline:
  name: "Test_ak_SOTA_V2_Test_Fujifilm"
  input_dir: "D:/studio/tools/vibecoding/sample_photos/ak/test"
  input_formats: ["raw", "jpg", "jpeg", "dng"]
  output_base: "D:/studio/tools/vibecoding/editor_1/wedding_ai_pipeline/output"
  output_format: "original"       # Options: "jpeg", "png", "tiff", "original" (DNG/RAW fallback to JPEG)
  gpu_backend: "auto"
  workers: 4
  metadata_required: false

culling:
  enabled: false
  blur_threshold: 100.0
  duplicate_threshold: 5
  quality_threshold: 70.0

restoration:
  enabled: false
  auto_route: true
  primary_model: "nafnet"
  face_restore: true

color_grading:
  enabled: true
  method: "sota_v2"               # USE THE NEW SOTA V2 ENGINE
  style: "natural"                # Base style preset
  strength: 0.2                   # Intensity of the grade

  # SOTA V2 PARAMETERS
  use_aces: true                  # Use ACEScg wide-gamut scene-linear working space

  # ADVANCED FEATURES (enabled via preset or overrides)
  segmentation_enabled: true      # Local semantic adjustments
  clahe_enabled: true             # Local contrast enhancement in Oklab L
  halation_enabled: true          # Film-like red scatter in highlights
  perlin_grain: true              # Luminance-mapped clumpy film grain

# ── Standalone LUT Application ──────────────────────────────────
# Applies ONLY the .cube LUT (with optional intensity blend) to the
# image — zero other editing.  Output goes to output/<name>/lut/
# Set color_grading.enabled: false to see the raw LUT effect only.
lut_application:
  enabled: true
  lut_path: "assets/luts/Shutterstock_Free_LUTs/OrangeAndBlue.cube"
  lut_intensity: 1.0              # 0.0 = original, 1.0 = full LUT, 0.5 = 50% blend

layout:
  enabled: false
  mode: "ai"
  ai_style: "magazine"
  background_directory: "assets/backgrounds/2"

narrative:
  enabled: false
