pipeline:
  name: "Test_SOTA_V2_test_ak_8"
  input_dir: "D:/studio/tools/vibecoding/sample_photos/ak/test"
  input_formats: ["raw", "jpg", "jpeg", "dng"]
  output_base: "D:/studio/tools/vibecoding/editor_1/wedding_ai_pipeline/output"
  output_format: "original"       # Options: "jpeg", "png", "tiff", "original" (DNG/RAW fallback to JPEG)
  gpu_backend: "auto"
  workers: 1
  metadata_required: false

culling:
  enabled: false
  blur_threshold: 100.0
  duplicate_threshold: 5
  quality_threshold: 70.0

restoration:
  enabled: false
  auto_route: true
  primary_model: "nafnet"
  face_restore: true

color_grading:
  enabled: false
  method: "sota_v2"               # USE THE NEW SOTA V2 ENGINE
  style: "natural"                # Base style preset
  strength: 0.2                   # Intensity of the grade

  # SOTA V2 PARAMETERS
  use_aces: false                  # Use ACEScg wide-gamut scene-linear working space

  # ADVANCED FEATURES (enabled via preset or overrides)
  segmentation_enabled: false      # Local semantic adjustments
  clahe_enabled: false             # Local contrast enhancement in Oklab L
  halation_enabled: false          # Film-like red scatter in highlights
  perlin_grain: false              # Luminance-mapped clumpy film grain

# ── Standalone LUT Application ──────────────────────────────────
# Applies ONLY the .cube LUT (with optional intensity blend) to the
# image — zero other editing.  Output goes to output/<name>/lut/
# Set color_grading.enabled: false to see the raw LUT effect only.
lut_application:
  enabled: true
  lut_path: "assets/luts/Referent Viewing LUT by CKC/iPhone - Apple Log/Referent_Apple Log 2_to_Rec709.cube"
  lut_intensity: 1.0              # 0.0 = original, 1.0 = full LUT, 0.5 = 50% blend
  logify: true                    # Convert linear RAW → log space before applying LUT
  delogify: true                 # Convert log → linear after LUT (for log→log LUTs)
  log_curve: "slog3"              # slog3 | logc3 | logc4 | cineon

layout:
  enabled: false
  mode: "ai"
  ai_style: "magazine"
  background_directory: "assets/backgrounds/lite_green"

narrative:
  enabled: false
