pipeline:
  name: "Test_SOTA_V2_BDAY26022026_cut"
  input_dir: "D:/studio/works/B DAY 26-02-26/PHOTOS"
  input_formats: ["raw", "jpg", "jpeg"]
  output_base: "D:/studio/tools/vibecoding/editor_1/wedding_ai_pipeline/output"
  gpu_backend: "auto"
  workers: 2                      # Legacy fallback (used if stage-specific workers not set)
  queue_maxsize: 2                # Bounded queue between grading & BG removal
                                  # Config 1 (16GB): 4  |  Config 2 (48GB): 16
  metadata_required: false

culling:
  enabled: false
  blur_threshold: 100.0
  duplicate_threshold: 5
  quality_threshold: 70.0
  workers: 6                     # CPU/Disk bound — use most threads
                                  # Config 1 (4c/8t): 6  |  Config 2 (8c/16t): 12

restoration:
  enabled: false
  auto_route: true
  primary_model: "nafnet"
  face_restore: true
  tiling:
    enabled: true
    tile_size: 512
    overlap: 64

color_grading:
  enabled: false
  method: "lab_statistical"
  style: "vibrant"               # OPTIONS: natural, cinematic, pastel, moody,
                                    #          golden_hour, film_kodak, film_fuji,
                                    #          vibrant, black_and_white
  strength: 1.5                     # 0.0 = no effect, 1.0 = full, 1.5 = max
  reference_image: "D:/studio/tools/vibecoding/editor_1/wedding_ai_pipeline/assets/reference_style.png"
  segmentation_enabled: true       # Set true to enable SAM-based local grading
  workers: 1                       # CPU/RAM bound — concurrent images being graded
                                   # Extremely fast. Safe to scale up to physical core count.

background_removal:
  enabled: false                     # Set true to generate cutouts (PNG with transparent bg)
  model: "birefnet-massive"        # BEST for weddings. Options: birefnet-portrait, birefnet-massive, bria-rmbg, u2net
  device: "gpu"                    # "cpu" or "gpu" (gpu requires onnxruntime-gpu)
  workers: 1                       # VRAM bound — concurrent GPU inferences
                                   # KEEP AT 1 for deep models (birefnet). >1 causes severe 
                                   # CUDA context-switching overhead with no throughput gain.

layout:
  enabled: true                     # Generate album pages
  mode: "ai"                        # template | ai | hybrid | mixed
  page_size: [7200, 4800]           # pixels [width, height] — 12"×8" at 300dpi
  dpi: 300
  images_per_page: 6                # 0 = auto (3–6 based on total count)
  padding: 60                       # outer margin in pixels
  gutter: 30                        # gap between cells in pixels
  use_cutouts: false                # true = composite RGBA cutouts over background
  background_directory: "assets/backgrounds/lite_green"
  background_strategy: "round_robin"   # dominant | average | random | round_robin | shuffle | fixed
  background_seed: ~                 # null = non-deterministic; set an int for round_robin/shuffle/random
  ai_style: "magazine"              # classic | elegant | minimal | dynamic | magazine
  ai_seed: 42                       # seed for reproducibility
  export:
    format: "both"                  # "jpeg" | "psd" | "both" (both = JPEG + layered PSD)
    quality: 95

cropping:
  enabled: false
  ratios: ["1:1", "9:16"]
  detector: "rtdetr"

watermark:
  enabled: false
  path: "assets/watermark.png"
  position: "auto"
  opacity: 0.5

narrative:
  enabled: false
  clustering_eps: 0.5